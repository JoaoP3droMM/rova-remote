# Rova-Remote: compila o motor para Windows (x64, MSYS2) e Linux (AppImage x86_64) e, numa tag
# rova-v*, publica os dois no Release do GitHub, de onde o Rova Games baixa. Os passos de compilação
# seguem os do chiaki-ng (build-release.yaml), sem o instalador e sem a assinatura.
name: Rova-Remote

on:
  push:
    branches: ['rova/**']
    tags: ['rova-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      sdl2_compat_tag: 2.32.74
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            compiler-rt:p

      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Build libplacebo
        run: scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          unzip -q ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/bin/." /mingw64/bin
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/include/." /mingw64/include
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/lib/." /mingw64/lib

      - name: Build sdl2-compat
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          INSTALL_PREFIX=/mingw64 scripts/build-hidapi.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF

      - name: Build
        run: cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy
        run: ./scripts/deploy-windows-msys2.sh rova-remote build/gui/chiaki.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml

      # O vídeo (libplacebo) exige o carregador do Vulkan (vulkan-1.dll), que só existe no PC se o driver da
      # placa de vídeo o instalou: sem ele o motor nem abre (teste num notebook com Windows, 25/11/2026). O
      # carregador vai junto (se o motor abre sem driver Vulkan no PC ainda não foi conferido).
      - name: Vulkan loader
        run: |
          cp /mingw64/bin/vulkan-1.dll rova-remote/
          test -f rova-remote/vulkan-1.dll

      # O motor responde sem abrir janela: "version" e um "regist" com PIN inválido (falha antes da rede).
      - name: Smoke test
        timeout-minutes: 5
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          cd rova-remote
          ./chiaki.exe version | tee version.txt
          grep -q '^@rova {"event":"version"' version.txt
          ./chiaki.exe regist 127.0.0.1 --pin 12 --account-id AAAAAAAAAAA= | tee regist.txt || true
          grep -q '"error":"pin"' regist.txt

      - name: Package
        run: zip -qr rova-remote-windows-x64.zip rova-remote

      - uses: actions/upload-artifact@v4
        with:
          name: rova-remote-windows-x64
          path: rova-remote-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux AppImage x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Setup Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: engine

      - name: Add QmlWebEngine Import
        working-directory: engine
        run: cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Build
        working-directory: engine
        run: |
          set -xe
          podman run --rm \
            -v "`pwd`:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t docker.io/streetpea/chiaki-ng-builder:qt6.9.3 \
            /bin/bash -c "sudo -E scripts/build-appimage.sh /build/appdir"
          cp appimage/chiaki-ng.AppImage ../rova-remote-linux-x86_64.AppImage

      - name: Smoke test
        timeout-minutes: 5
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          # O AppImage usa as bibliotecas de vídeo do sistema (todo PC Linux com tela tem; a máquina do CI não).
          sudo apt-get install -y libva2 libva-drm2 libva-x11-2 libva-wayland2 libvdpau1 libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1
          chmod +x rova-remote-linux-x86_64.AppImage
          # Sem DISPLAY e sem QT_QPA_PLATFORM: o "version" e o "regist" têm de rodar sem tela.
          ./rova-remote-linux-x86_64.AppImage --appimage-extract-and-run version | tee version.txt
          grep -q '^@rova {"event":"version"' version.txt
          # Opções depois do comando também valem (o PIN curto é recusado antes de ir à rede).
          ./rova-remote-linux-x86_64.AppImage --appimage-extract-and-run regist 127.0.0.1 --pin 12 --account-id AAAAAAAAAAA= | tee regist.txt || true
          grep -q '"error":"pin"' regist.txt
          ./rova-remote-linux-x86_64.AppImage --appimage-extract-and-run regist 127.0.0.1 --pin 12345678 --account-id AAAA | tee regist2.txt || true
          grep -q '"error":"account-id"' regist2.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rova-remote-linux-x86_64
          path: rova-remote-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publicar
    if: startsWith(github.ref, 'refs/tags/rova-v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rova-remote-windows-x64.zip
            rova-remote-linux-x86_64.AppImage
